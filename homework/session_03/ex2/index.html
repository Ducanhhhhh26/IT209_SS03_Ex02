<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - My Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 12px;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>My Web Homepage</h1>
        <p>Hệ thống Web Server Nginx đang hoạt động bình thường.</p>
    </div>
</body>
</html>
